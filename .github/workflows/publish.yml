name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or resume (e.g. v4.9.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve release tag and validate every workspace version
        id: release
        run: node scripts/release-artifacts.mjs preflight --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.preflight.outputs.sha }}
      retain-artifacts: true

  publish:
    needs: [preflight, verify]
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          path: release-source
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publication-tools
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Test the publication tooling selected by this workflow revision
        run: node --test "$GITHUB_WORKSPACE/publication-tools/scripts/release-artifacts.test.mjs"
      - uses: actions/download-artifact@v4
        with:
          name: agentium-release-${{ needs.preflight.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentium-release
      - name: Verify and reconcile publication of the exact retained tarballs
        working-directory: release-source
        run: node "$GITHUB_WORKSPACE/publication-tools/scripts/release-artifacts.mjs" publish --directory "$RUNNER_TEMP/agentium-release" --ref "$RELEASE_REF" --version "$RELEASE_VERSION" --manifest-sha256 "$MANIFEST_SHA256" --reconciliation-timeout-ms 600000 --publish-concurrency 3
        env:
          RELEASE_REF: ${{ needs.preflight.outputs.sha }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          MANIFEST_SHA256: ${{ needs.verify.outputs.manifest-sha256 }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Retain publication outcomes for safe manual resume
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentium-publication-${{ needs.preflight.outputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentium-release/outcomes.json
          if-no-files-found: warn
      - name: Create GitHub Release after every package is verified
        uses: softprops/action-gh-release@v2
        with:
          name: Agentium v${{ needs.preflight.outputs.version }}
          tag_name: ${{ needs.preflight.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
